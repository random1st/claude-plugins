# Publish the signed catalog to the Axela notary for countersigning.
#
# No stored secret: the job authenticates with the OIDC token GitHub mints for it
# (`id-token: write`), and the notary accepts it only because this exact repository is
# registered there. The catalog itself is signed on the publisher's machine — the key
# never enters CI; a workflow edit alone cannot publish anything the notary would sign.
#
# The submission is inlined rather than done through the random1st/skilltrust action:
# that repository is private, and GitHub only shares private actions with private
# repositories. When it goes public, replace this step with `uses: random1st/skilltrust`
# with `command: notarize` — and its verify step too.
name: notarize

on:
  push:
    branches: [main]
    paths:
      - catalog.dsse.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  notarize:
    runs-on: ubuntu-latest
    env:
      NOTARY_URL: https://notary.axela.app/v1/catalogs/random1st/groundwork
      NOTARY_AUDIENCE: skilltrust-notary
    steps:
      - uses: actions/checkout@v4

      - name: Submit for countersigning
        run: |
          set -euo pipefail
          token=$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${NOTARY_AUDIENCE}" | jq -r '.value')
          if [ -z "${token}" ] || [ "${token}" = "null" ]; then
            echo "::error::minting the OIDC token failed" >&2
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X PUT -H "Authorization: Bearer ${token}" \
            --data-binary @catalog.dsse.json "${NOTARY_URL}")
          if [ "${status}" != "200" ]; then
            echo "::error::the notary answered ${status}: $(cat response.json)" >&2
            exit 1
          fi
          echo "notarized: ${NOTARY_URL}"
          jq '.signatures | length' response.json
